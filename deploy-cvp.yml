---
- name: Deploy Configurations via CloudVision
  hosts: FABRIC # (1)!
  gather_facts: false
  connection: local
  tasks:

    - name: Deploy Configurations via CloudVision # (2)!
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_server: www.cv-staging.corp.arista.io
        cv_token: yourtokengoeshere
        cv_submit_workspace: false